<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>文件分享</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .share-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 32px;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 480px;
            text-align: center;
        }
        .share-card h2 {
            font-size: 28px;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 8px;
        }
        .share-card h2 i {
            color: #3b82f6;
            margin-right: 10px;
        }
        .file-icon {
            font-size: 56px;
            color: #3b82f6;
            margin: 20px 0;
        }
        #fileName {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 24px;
            color: #334155;
        }
        .input-group {
            margin-bottom: 24px;
        }
        .input-group input {
            width: 100%;
            padding: 16px 20px;
            font-size: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 20px;
            outline: none;
            background: #f8fafc;
            transition: all 0.2s;
        }
        .input-group input:focus {
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }
        .download-btn {
            width: 100%;
            padding: 18px;
            font-size: 18px;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            box-shadow: 0 8px 20px rgba(59,130,246,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(59,130,246,0.4);
        }
        #toast {
            visibility: hidden;
            min-width: 280px;
            background: #1e293b;
            color: white;
            text-align: center;
            border-radius: 60px;
            padding: 14px 24px;
            position: fixed;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            z-index: 1000;
            font-weight: 500;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        #toast.show {
            visibility: visible;
            animation: toastFade 3s;
        }
        @keyframes toastFade {
            0% { opacity: 0; bottom: 10px; }
            10% { opacity: 1; bottom: 30px; }
            90% { opacity: 1; bottom: 30px; }
            100% { opacity: 0; bottom: 10px; }
        }
    </style>
</head>
<body>
<div class="share-card">
    <h2><i class="fas fa-share-alt"></i> 文件分享</h2>
    <div class="file-icon"><i class="fas fa-file-alt"></i></div>
    <p id="fileName">加载中...</p>
    <div id="pwdSection" style="display:none;" class="input-group">
        <input type="text" id="password" placeholder="请输入提取码">
    </div>
    <button id="downloadBtn" class="download-btn"><i class="fas fa-download"></i> 下载文件</button>
</div>
<div id="toast"></div>
<script>
    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.className = 'show';
        setTimeout(() => { toast.className = toast.className.replace('show', ''); }, 3000);
    }

    const path = window.location.pathname;
    const code = path.split('/').pop();

    document.getElementById('downloadBtn').onclick = async () => {
        const password = document.getElementById('password')?.value || '';
        const resp = await fetch('/s/' + code + '/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: 'password=' + encodeURIComponent(password)
        });
        if (resp.ok) {
            const blob = await resp.blob();
            const disposition = resp.headers.get('Content-Disposition');
            let filename = 'file';
            if (disposition && disposition.indexOf('filename*=') !== -1) {
                const match = disposition.match(/filename\*=UTF-8''([^;]+)/);
                if (match) filename = decodeURIComponent(match[1]);
            } else if (disposition && disposition.indexOf('filename=') !== -1) {
                const match = disposition.match(/filename="?([^";]+)"?/);
                if (match) filename = match[1];
            }
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            window.URL.revokeObjectURL(url);
        } else {
            const text = await resp.text();
            showToast(text || '下载失败');
        }
    };

    (async function checkNeedPwd() {
        try {
            const testResp = await fetch('/s/' + code + '/verify', { method: 'POST', body: '' });
            if (testResp.status === 400) {
                const text = await testResp.text();
                if (text.includes('提取码')) {
                    document.getElementById('pwdSection').style.display = 'block';
                    document.getElementById('fileName').innerText = '该分享需要提取码';
                } else {
                    document.getElementById('fileName').innerText = '点击下载按钮获取文件';
                }
            } else {
                document.getElementById('fileName').innerText = '点击下载按钮获取文件';
            }
        } catch (e) {
            document.getElementById('fileName').innerText = '获取分享信息失败';
        }
    })();
</script>
</body>
</html>

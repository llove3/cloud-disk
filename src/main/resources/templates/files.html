<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>我的网盘</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f1f5f9; color: #1e293b; padding: 24px 32px; min-height: 100vh; position: relative; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
        .header h2 { font-size: 28px; font-weight: 600; display: flex; align-items: center; gap: 10px; color: #0f172a; }
        .header h2 i { color: #3b82f6; }
        .user-info { display: flex; align-items: center; gap: 16px; background: white; padding: 8px 16px; border-radius: 40px; box-shadow: 0 2px 6px rgba(0,0,0,0.03); }
        .user-info a, .user-info span.logout-link { color: #3b82f6; text-decoration: none; font-weight: 500; margin: 0 4px; cursor: pointer; }
        .user-info a:hover, .user-info span.logout-link:hover { text-decoration: underline; }
        .avatar-icon { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 1px solid #e2e8f0; cursor: pointer; }
        .upload-area { background: white; padding: 16px 24px; border-radius: 20px; display: flex; align-items: center; gap: 16px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.02); border: 1px solid #e2e8f0; }
        .upload-area input[type="file"] { flex: 1; padding: 8px; border: 2px dashed #cbd5e1; border-radius: 12px; background: #f8fafc; cursor: pointer; }
        .upload-btn, .folder-btn { background: #3b82f6; color: white; border: none; padding: 12px 28px; border-radius: 30px; font-weight: 600; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 10px rgba(59,130,246,0.2); display: flex; align-items: center; gap: 8px; }
        .folder-btn { background: #8b5cf6; box-shadow: 0 4px 10px rgba(139,92,246,0.2); }
        .upload-btn:hover, .folder-btn:hover { transform: translateY(-2px); }
        .list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .breadcrumb { display: flex; align-items: center; gap: 8px; }
        .breadcrumb a { color: #3b82f6; text-decoration: none; cursor: pointer; }
        .space-card { background: white; padding: 8px 20px; border-radius: 40px; display: inline-flex; align-items: center; gap: 16px; box-shadow: 0 2px 6px rgba(0,0,0,0.03); border: 1px solid #eef2f6; }
        .space-text { font-size: 14px; font-weight: 500; color: #475569; }
        progress { width: 180px; height: 8px; border-radius: 10px; overflow: hidden; }
        progress::-webkit-progress-bar { background-color: #e2e8f0; border-radius: 10px; }
        progress::-webkit-progress-value { background: linear-gradient(90deg, #3b82f6, #8b5cf6); border-radius: 10px; }
        .calibrate-btn { background: none; border: none; color: #64748b; cursor: pointer; font-size: 16px; padding: 4px 8px; border-radius: 20px; transition: background 0.2s; }
        .calibrate-btn:hover { background: #f1f5f9; color: #3b82f6; }
        .file-table-container { background: white; border-radius: 24px; padding: 8px 0; box-shadow: 0 8px 24px rgba(0,0,0,0.04); border: 1px solid #eef2f6; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 18px 20px; background: #f8fafc; font-weight: 600; font-size: 14px; color: #475569; border-bottom: 1px solid #e2e8f0; }
        td { padding: 16px 20px; border-bottom: 1px solid #f1f5f9; color: #334155; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #fafbff; }
        .action-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
        .action-btn { background: none; border: 1px solid #e2e8f0; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 500; color: #475569; cursor: pointer; transition: all 0.15s; display: inline-flex; align-items: center; gap: 4px; }
        .action-btn:hover { background: #3b82f6; border-color: #3b82f6; color: white; }
        .folder-icon { color: #fbbf24; margin-right: 6px; }
        .recycle-fab { position: fixed; bottom: 30px; right: 30px; background: #1e293b; color: white; width: 56px; height: 56px; border-radius: 30px; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(0,0,0,0.15); transition: all 0.2s; text-decoration: none; z-index: 100; }
        .recycle-fab:hover { background: #0f172a; transform: scale(1.05); }
        #toast { visibility: hidden; min-width: 280px; background: #1e293b; color: white; text-align: center; border-radius: 60px; padding: 14px 24px; position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%); z-index: 1000; font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        #toast.show { visibility: visible; animation: toastFade 3s; }
        @keyframes toastFade { 0% { opacity: 0; bottom: 10px; } 10% { opacity: 1; bottom: 30px; } 90% { opacity: 1; bottom: 30px; } 100% { opacity: 0; bottom: 10px; } }
        .modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.4); }
        .modal-content { background: white; margin: 5% auto; padding: 28px; border-radius: 28px; width: 520px; max-width: 90%; box-shadow: 0 30px 60px rgba(0,0,0,0.12); }
        .modal-content h3 { font-size: 22px; margin-bottom: 20px; color: #0f172a; }
        .version-item { background: #f8fafc; padding: 16px; border-radius: 16px; margin-bottom: 12px; border: 1px solid #eef2f6; }
        .version-item button { background: white; border: 1px solid #cbd5e1; padding: 6px 16px; border-radius: 30px; margin-right: 8px; margin-top: 8px; cursor: pointer; font-weight: 500; transition: all 0.15s; }
        .version-item button:hover { background: #3b82f6; border-color: #3b82f6; color: white; }
        .confirm-dialog { background: white; padding: 32px; border-radius: 28px; width: 360px; margin: 15% auto; text-align: center; }
        .confirm-dialog button { padding: 10px 28px; margin: 8px; border-radius: 40px; border: none; font-weight: 600; cursor: pointer; }
        #confirmYes { background: #3b82f6; color: white; }
        #confirmNo { background: #f1f5f9; color: #1e293b; }
        .close { font-size: 24px; color: #94a3b8; float: right; cursor: pointer; }
        .close:hover { color: #0f172a; }
        #shareContent input { width: 100%; padding: 12px 16px; border: 2px solid #e2e8f0; border-radius: 16px; margin: 8px 0 16px; font-size: 14px; background: #fafcff; }
        #shareContent button { background: #3b82f6; color: white; border: none; padding: 12px 24px; border-radius: 40px; font-weight: 600; cursor: pointer; }
        .rename-dialog { background: white; padding: 28px; border-radius: 24px; width: 400px; margin: 20% auto; text-align: left; }
        .rename-dialog h3 { margin-bottom: 16px; color: #0f172a; }
        .rename-dialog input { width: 100%; padding: 12px 16px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 14px; margin-bottom: 20px; }
        .rename-dialog button { padding: 10px 20px; border-radius: 30px; border: none; font-weight: 600; cursor: pointer; margin-right: 10px; }
        #renameConfirm { background: #3b82f6; color: white; }
        #renameCancel { background: #f1f5f9; color: #1e293b; }
        .preview-modal-content { width: 80%; height: 80%; margin: 5% auto; }
        .preview-iframe { width: 100%; height: 100%; border: none; }
        .image-preview-content { width: auto; max-width: 90vw; text-align: center; background: transparent; box-shadow: none; padding: 0; }
        #previewImage { max-width: 100%; max-height: 85vh; object-fit: contain; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .folder-path-row { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; }
        .folder-path-row input { flex: 1; background: #f8fafc; }
        .folder-picker-list { max-height: 300px; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 12px; margin-bottom: 16px; }
        .folder-picker-item { padding: 12px 16px; border-bottom: 1px solid #f1f5f9; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .folder-picker-item:hover { background: #f1f5ff; }
        .folder-picker-item.selected { background: #e0edff; border-left: 4px solid #3b82f6; }
        .picker-actions { display: flex; gap: 8px; margin-top: 8px; }
    </style>
</head>
<body>
<div class="header">
    <h2><i class="fas fa-cloud"></i> 我的网盘</h2>
    <div class="user-info">
        <a href="/profile">
            <img id="headerAvatar" class="avatar-icon"
                 th:src="${session.user.avatar != null ? session.user.avatar : '/images/default.png'}"
                 alt="头像">
        </a>
        <span id="headerUsername" th:text="${session.user.username}"></span>
        <a href="/shares"><i class="fas fa-share-alt"></i> 我的分享</a>
        <span class="logout-link" onclick="logoutAndClose()"><i class="fas fa-sign-out-alt"></i> 退出</span>
        <span class="logout-link" onclick="switchAccount()"><i class="fas fa-user-friends"></i> 切换账号</span>
    </div>
</div>

<div class="upload-area">
    <input type="file" id="fileInput" multiple>
    <button id="uploadBtn" class="upload-btn"><i class="fas fa-upload"></i>上传文件</button>
    <button id="newFolderBtn" class="folder-btn"><i class="fas fa-folder-plus"></i>新建文件夹</button>
</div>

<div class="list-header">
    <div class="breadcrumb" id="breadcrumb">
        <a onclick="navigateTo(0)"><i class="fas fa-home"></i> 根目录</a>
    </div>
    <div class="space-card">
        <i class="fas fa-database" style="color: #3b82f6;"></i>
        <span class="space-text" id="spaceInfo"></span>
        <progress id="spaceProgress" value="0" max="100"></progress>
        <button class="calibrate-btn" id="calibrateSpaceBtn" title="校准空间"><i class="fas fa-sync-alt"></i></button>
    </div>
</div>

<div class="file-table-container">
    <table id="fileTable">
        <thead><tr><th>文件名</th><th>大小</th><th>上传时间</th><th>操作</th></tr></thead>
        <tbody id="fileList"></tbody>
    </table>
</div>

<a href="/recycle" class="recycle-fab" title="回收站"><i class="fas fa-trash-alt"></i></a>

<div id="toast"></div>

<div id="uploadSetupModal" class="modal">
    <div class="modal-content" style="width: 480px;">
        <span class="close" onclick="closeUploadSetupModal()">&times;</span>
        <h3>上传文件设置</h3>
        <div style="margin-bottom: 16px;">
            <label style="display: block; margin-bottom: 6px; font-weight: 500;">文件名</label>
            <input type="text" id="uploadFileName" style="width: 100%; padding: 12px 16px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 14px;">
        </div>
        <div style="margin-bottom: 16px;">
            <label style="display: block; margin-bottom: 6px; font-weight: 500;">目标文件夹</label>
            <div class="folder-path-row">
                <input type="text" id="selectedFolderPath" readonly style="flex: 1; padding: 12px 16px; border: 2px solid #e2e8f0; border-radius: 12px; background: #f8fafc;">
                <button type="button" id="browseFolderBtn" style="padding: 12px 16px; background: #f1f5f9; border: 2px solid #e2e8f0; border-radius: 12px; cursor: pointer; white-space: nowrap;"><i class="fas fa-folder-open"></i> 浏览</button>
            </div>
        </div>
        <div style="text-align: right;">
            <button id="uploadSetupCancel" style="padding: 10px 20px; border-radius: 30px; border: none; font-weight: 600; cursor: pointer; background: #f1f5f9; margin-right: 10px;">取消</button>
            <button id="uploadSetupConfirm" style="padding: 10px 20px; border-radius: 30px; border: none; font-weight: 600; cursor: pointer; background: #3b82f6; color: white;">开始上传</button>
        </div>
    </div>
</div>

<div id="folderPickerModal" class="modal">
    <div class="modal-content" style="width: 550px;">
        <span class="close" onclick="closeFolderPickerModal()">&times;</span>
        <h3>选择文件夹</h3>
        <div class="breadcrumb" id="pickerBreadcrumb" style="margin-bottom: 12px;">
            <a onclick="pickerNavigateTo(0)"><i class="fas fa-home"></i> 根目录</a>
        </div>
        <div class="folder-picker-list" id="folderPickerList"></div>
        <div class="picker-actions">
            <button id="newFolderInPickerBtn" style="padding: 8px 16px; background: #8b5cf6; color: white; border: none; border-radius: 30px; font-weight: 500; cursor: pointer;"><i class="fas fa-folder-plus"></i> 新建文件夹</button>
            <div style="flex:1;"></div>
            <button id="selectCurrentFolderBtn" style="padding: 10px 24px; background: #3b82f6; color: white; border: none; border-radius: 30px; font-weight: 600; cursor: pointer;">选择此文件夹</button>
        </div>
    </div>
</div>

<div id="renameModal" class="modal">
    <div class="rename-dialog">
        <h3>重命名文件</h3>
        <p id="renameOriginalName" style="margin-bottom: 8px; color: #64748b;"></p>
        <input type="text" id="renameInput" placeholder="输入新文件名">
        <div style="text-align: right;">
            <button id="renameCancel">取消</button>
            <button id="renameConfirm">确定</button>
        </div>
    </div>
</div>
<div id="versionModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeVersionModal()">&times;</span>
        <h3>历史版本</h3>
        <div id="versionListContainer"></div>
    </div>
</div>
<div id="shareModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeShareModal()">&times;</span>
        <h3>分享文件</h3>
        <div id="shareContent"></div>
    </div>
</div>
<div id="confirmModal" class="modal">
    <div class="confirm-dialog">
        <p id="confirmMessage">确定要执行此操作吗？</p>
        <button id="confirmYes">确定</button>
        <button id="confirmNo">取消</button>
    </div>
</div>
<div id="previewModal" class="modal">
    <div class="modal-content preview-modal-content">
        <span class="close" onclick="closePreviewModal()">&times;</span>
        <iframe id="previewFrame" class="preview-iframe"></iframe>
    </div>
</div>
<div id="imagePreviewModal" class="modal">
    <div class="modal-content image-preview-content">
        <span class="close" onclick="closeImagePreview()">&times;</span>
        <img id="previewImage" alt="预览图片">
    </div>
</div>

<script>
    let currentParentId = 0;
    let currentFileIdForVersion = null;
    let confirmCallback = null;
    let renamePromiseResolve = null;
    let folderPromiseResolve = null;
    let currentImageUrl = null;

    let pendingFiles = [];
    let uploadSetupResolve = null;
    let selectedTargetParentId = 0;
    let selectedTargetPath = '根目录';

    let pickerCurrentParentId = 0;
    let pickerBreadcrumbStack = [{id:0, name:'根目录'}];
    let pickerSelectedFolderId = 0;
    let pickerSelectedFolderName = '根目录';

    function parseLocalTime(dateStr) {
        if (!dateStr) return '';
        let d = new Date(dateStr);
        if (!isNaN(d.getTime())) return d.toLocaleString();
        d = new Date(dateStr.replace(' ', 'T') + 'Z');
        if (!isNaN(d.getTime())) return d.toLocaleString();
        return dateStr;
    }
    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.className = 'show';
        setTimeout(() => { toast.className = toast.className.replace('show', ''); }, 3000);
    }
    function showConfirm(message, onConfirm) {
        document.getElementById('confirmMessage').innerText = message;
        document.getElementById('confirmModal').style.display = 'block';
        confirmCallback = onConfirm;
    }
    function closeConfirm() {
        document.getElementById('confirmModal').style.display = 'none';
        confirmCallback = null;
    }
    document.getElementById('confirmYes').onclick = function() {
        if (confirmCallback) confirmCallback();
        closeConfirm();
    };
    document.getElementById('confirmNo').onclick = closeConfirm;
    function formatSize(bytes) {
        if (bytes === 0) return '-';
        const k = 1024;
        const sizes = ['B', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return (bytes / Math.pow(k, i)).toFixed(2) + ' ' + sizes[i];
    }
    function updateSpaceDisplay(used, total) {
        const percent = total > 0 ? (used / total) * 100 : 0;
        document.getElementById('spaceInfo').innerText = formatSize(used) + ' / ' + formatSize(total);
        document.getElementById('spaceProgress').value = percent;
    }
    function loadSpaceInfo() {
        fetch('/api/user/space')
            .then(res => res.json())
            .then(data => { updateSpaceDisplay(data.used || 0, data.total || 0); });
    }
    function calibrateSpace() {
        showToast('正在校准空间...');
        fetch('/api/user/recalculate-space', { method: 'POST' })
            .then(res => res.text())
            .then(msg => { showToast(msg); loadSpaceInfo(); });
    }
    document.getElementById('calibrateSpaceBtn').onclick = calibrateSpace;

    function navigateTo(parentId) {
        currentParentId = parentId;
        updateBreadcrumb();
        loadFileList();
    }

    function updateBreadcrumb() {
        const bc = document.getElementById('breadcrumb');
        bc.innerHTML = `<a onclick="navigateTo(0)"><i class="fas fa-home"></i> 根目录</a>`;
        if (currentParentId !== 0) {
            bc.innerHTML += ` <span>/</span> <span>当前文件夹</span>`;
        }
    }

    function loadFileList() {
        fetch('/api/file/list?parentId=' + currentParentId)
            .then(res => res.json())
            .then(files => {
                const tbody = document.getElementById('fileList');
                tbody.innerHTML = '';
                files.forEach(file => {
                    const row = tbody.insertRow();
                    const isFolder = file.fileSize === 0 && !file.filePath;
                    let nameHtml = file.fileName;
                    if (isFolder) {
                        nameHtml = `<i class="fas fa-folder folder-icon"></i> ` + file.fileName;
                    } else {
                        nameHtml = `<i class="fas fa-file"></i> ` + file.fileName;
                    }
                    const nameCell = row.insertCell(0);
                    nameCell.innerHTML = nameHtml;
                    if (isFolder) {
                        nameCell.style.cursor = 'pointer';
                        nameCell.onclick = () => navigateTo(file.id);
                    }
                    row.insertCell(1).innerText = isFolder ? '-' : formatSize(file.fileSize);
                    row.insertCell(2).innerText = parseLocalTime(file.createdAt);
                    const actions = row.insertCell(3);
                    if (!isFolder) {
                        const previewBtn = document.createElement('button');
                        previewBtn.className = 'action-btn';
                        previewBtn.innerHTML = '<i class="fas fa-eye"></i>预览';
                        previewBtn.onclick = () => previewFile(file.id, file.fileName);
                        actions.appendChild(previewBtn);
                    }
                    const downloadBtn = document.createElement('button');
                    downloadBtn.className = 'action-btn';
                    downloadBtn.innerHTML = '<i class="fas fa-download"></i>下载';
                    downloadBtn.onclick = () => { window.location.href = '/api/file/download?fileId=' + file.id; };
                    if (!isFolder) actions.appendChild(downloadBtn);
                    const versionsBtn = document.createElement('button');
                    versionsBtn.className = 'action-btn';
                    versionsBtn.innerHTML = '<i class="fas fa-code-branch"></i>版本';
                    versionsBtn.onclick = () => { openVersionModal(file.id); };
                    if (!isFolder) actions.appendChild(versionsBtn);
                    const shareBtn = document.createElement('button');
                    shareBtn.className = 'action-btn';
                    shareBtn.innerHTML = '<i class="fas fa-share-alt"></i>分享';
                    shareBtn.onclick = () => { openShareModal(file.id); };
                    if (!isFolder) actions.appendChild(shareBtn);
                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'action-btn';
                    deleteBtn.innerHTML = '<i class="fas fa-trash"></i>删除';
                    deleteBtn.onclick = () => {
                        fetch('/api/file/delete?fileId=' + file.id, { method: 'POST' })
                            .then(res => res.text())
                            .then(msg => { showToast(msg); loadFileList(); loadSpaceInfo(); });
                    };
                    actions.appendChild(deleteBtn);
                });
            });
    }

    function showImagePreview(url) {
        if (currentImageUrl) {
            URL.revokeObjectURL(currentImageUrl);
        }
        currentImageUrl = url;
        document.getElementById('previewImage').src = url;
        document.getElementById('imagePreviewModal').style.display = 'block';
    }

    function closeImagePreview() {
        document.getElementById('imagePreviewModal').style.display = 'none';
        if (currentImageUrl) {
            URL.revokeObjectURL(currentImageUrl);
            currentImageUrl = null;
        }
        document.getElementById('previewImage').src = '';
    }

    function openInNewTab(blobUrl) {
        window.open(blobUrl, '_blank');
    }

    function previewFile(fileId, fileName) {
        const ext = fileName.split('.').pop().toLowerCase();
        if (['jpg','jpeg','png','gif','bmp','webp'].includes(ext)) {
            fetch('/api/file/preview/' + fileId)
                .then(res => res.blob())
                .then(blob => {
                    const url = URL.createObjectURL(blob);
                    showImagePreview(url);
                });
        } else if (ext === 'pdf') {
            fetch('/api/file/preview/' + fileId)
                .then(res => res.blob())
                .then(blob => {
                    const url = URL.createObjectURL(blob);
                    openInNewTab(url);
                });
        } else if (['txt','md','java','xml','json','properties','yml','yaml'].includes(ext)) {
            fetch('/api/file/preview/' + fileId)
                .then(res => res.text())
                .then(text => {
                    const blob = new Blob([text], {type: 'text/plain'});
                    const url = URL.createObjectURL(blob);
                    document.getElementById('previewFrame').src = url;
                    document.getElementById('previewModal').style.display = 'block';
                });
        } else {
            showToast('不支持在线预览此格式，请下载后查看');
        }
    }

    function previewVersion(versionId, fileName) {
        const ext = fileName.split('.').pop().toLowerCase();
        if (['jpg','jpeg','png','gif','bmp','webp'].includes(ext)) {
            fetch('/api/file/version/preview/' + versionId)
                .then(res => res.blob())
                .then(blob => {
                    const url = URL.createObjectURL(blob);
                    showImagePreview(url);
                });
        } else if (ext === 'pdf') {
            fetch('/api/file/version/preview/' + versionId)
                .then(res => res.blob())
                .then(blob => {
                    const url = URL.createObjectURL(blob);
                    openInNewTab(url);
                });
        } else if (['txt','md','java','xml','json','properties','yml','yaml'].includes(ext)) {
            fetch('/api/file/version/preview/' + versionId)
                .then(res => res.text())
                .then(text => {
                    const blob = new Blob([text], {type: 'text/plain'});
                    const url = URL.createObjectURL(blob);
                    document.getElementById('previewFrame').src = url;
                    document.getElementById('previewModal').style.display = 'block';
                });
        } else {
            showToast('不支持在线预览此格式，请下载后查看');
        }
    }

    function closePreviewModal() {
        document.getElementById('previewModal').style.display = 'none';
        document.getElementById('previewFrame').src = '';
    }

    async function requestRename(originalName) {
        return new Promise((resolve, reject) => {
            document.getElementById('renameOriginalName').innerText = '原文件名：' + originalName;
            document.getElementById('renameInput').value = originalName;
            document.getElementById('renameModal').style.display = 'block';
            renamePromiseResolve = resolve;
        });
    }
    function closeRenameModal(confirmed, newName) {
        document.getElementById('renameModal').style.display = 'none';
        if (confirmed && renamePromiseResolve) renamePromiseResolve(newName);
        renamePromiseResolve = null;
    }
    document.getElementById('renameConfirm').onclick = function() {
        const newName = document.getElementById('renameInput').value.trim();
        if (newName === '') { showToast('文件名不能为空'); return; }
        closeRenameModal(true, newName);
    };
    document.getElementById('renameCancel').onclick = function() { closeRenameModal(false); };

    async function uploadSingleFile(file, newFileName, targetParentId) {
        try {
            const spaceResp = await fetch('/api/user/space');
            const spaceData = await spaceResp.json();
            if (spaceData.used + file.size > spaceData.total) {
                showToast(`空间不足，无法上传 "${newFileName}"`);
                return false;
            }
            const formData = new FormData();
            formData.append('file', file, newFileName);
            formData.append('parentId', targetParentId);
            const uploadResp = await fetch('/api/file/upload', { method: 'POST', body: formData });
            const result = await uploadResp.json();
            showToast(result.message);
            if (result.success) {
                await loadSpaceInfo();
                return true;
            }
            return false;
        } catch (err) {
            showToast('上传失败：' + err.message);
            return false;
        }
    }

    function openUploadSetupModal(files) {
        pendingFiles = files;
        selectedTargetParentId = currentParentId;
        selectedTargetPath = currentParentId === 0 ? '根目录' : '当前文件夹';
        document.getElementById('uploadFileName').value = files.length === 1 ? files[0].name : '';
        document.getElementById('selectedFolderPath').value = selectedTargetPath;
        document.getElementById('uploadSetupModal').style.display = 'block';
        return new Promise((resolve) => {
            uploadSetupResolve = resolve;
        });
    }

    function closeUploadSetupModal(confirmed, newName, targetParentId) {
        document.getElementById('uploadSetupModal').style.display = 'none';
        if (uploadSetupResolve) {
            uploadSetupResolve({ confirmed, newName, targetParentId });
            uploadSetupResolve = null;
        }
    }

    document.getElementById('uploadSetupCancel').onclick = function() {
        closeUploadSetupModal(false, null, null);
    };

    document.getElementById('uploadSetupConfirm').onclick = function() {
        let newName = document.getElementById('uploadFileName').value.trim();
        if (newName === '' && pendingFiles.length === 1) {
            newName = pendingFiles[0].name;
        }
        if (newName === '') {
            showToast('请输入文件名');
            return;
        }
        closeUploadSetupModal(true, newName, selectedTargetParentId);
    };

    document.getElementById('browseFolderBtn').onclick = function() {
        pickerCurrentParentId = 0;
        pickerBreadcrumbStack = [{id:0, name:'根目录'}];
        pickerSelectedFolderId = selectedTargetParentId;
        pickerSelectedFolderName = selectedTargetPath;
        updatePickerBreadcrumb();
        loadPickerFolderList();
        document.getElementById('folderPickerModal').style.display = 'block';
    };

    function updatePickerBreadcrumb() {
        const bc = document.getElementById('pickerBreadcrumb');
        let html = '';
        pickerBreadcrumbStack.forEach((item, index) => {
            if (index > 0) html += ' <span>/</span> ';
            html += `<a onclick="pickerNavigateTo(${item.id}, ${index})">${item.name}</a>`;
        });
        bc.innerHTML = html;
    }

    function pickerNavigateTo(parentId, stackIndex) {
        if (stackIndex !== undefined) {
            pickerBreadcrumbStack = pickerBreadcrumbStack.slice(0, stackIndex + 1);
        } else {
            pickerBreadcrumbStack.push({id: parentId, name: '...'});
        }
        pickerCurrentParentId = parentId;
        loadPickerFolderList().then(() => {
            if (stackIndex === undefined) {
                const currentFolder = document.querySelector(`[data-folder-id="${parentId}"]`);
                if (currentFolder) {
                    const name = currentFolder.querySelector('.folder-name')?.innerText || '文件夹';
                    pickerBreadcrumbStack[pickerBreadcrumbStack.length-1].name = name;
                    updatePickerBreadcrumb();
                }
            }
        });
    }

    async function loadPickerFolderList() {
        const resp = await fetch('/api/file/list?parentId=' + pickerCurrentParentId);
        const files = await resp.json();
        const folders = files.filter(f => f.fileSize === 0 && !f.filePath);
        const container = document.getElementById('folderPickerList');
        container.innerHTML = '';
        if (folders.length === 0) {
            container.innerHTML = '<div style="padding:16px; text-align:center; color:#64748b;">此文件夹下没有子文件夹</div>';
        } else {
            folders.forEach(folder => {
                const div = document.createElement('div');
                div.className = 'folder-picker-item';
                div.setAttribute('data-folder-id', folder.id);
                div.innerHTML = `<i class="fas fa-folder folder-icon"></i> <span class="folder-name">${folder.fileName}</span>`;
                div.onclick = (e) => {
                    document.querySelectorAll('.folder-picker-item').forEach(el => el.classList.remove('selected'));
                    div.classList.add('selected');
                    pickerSelectedFolderId = folder.id;
                    pickerSelectedFolderName = folder.fileName;
                };
                div.ondblclick = () => {
                    pickerNavigateTo(folder.id);
                };
                container.appendChild(div);
                if (folder.id === pickerSelectedFolderId) {
                    div.classList.add('selected');
                }
            });
        }
    }

    function closeFolderPickerModal() {
        document.getElementById('folderPickerModal').style.display = 'none';
    }

    document.getElementById('selectCurrentFolderBtn').onclick = function() {
        let path = pickerBreadcrumbStack.map(item => item.name).join(' / ');
        if (pickerSelectedFolderId === 0) {
            path = '根目录';
        } else {
            path = path + ' / ' + pickerSelectedFolderName;
        }
        selectedTargetParentId = pickerSelectedFolderId;
        selectedTargetPath = path;
        document.getElementById('selectedFolderPath').value = path;
        closeFolderPickerModal();
    };

    document.getElementById('newFolderInPickerBtn').onclick = function() {
        const folderName = prompt('请输入新文件夹名称');
        if (!folderName) return;
        const formData = new FormData();
        formData.append('folderName', folderName);
        formData.append('parentId', pickerCurrentParentId);
        fetch('/api/file/folder/create', { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
                showToast(data.message);
                if (data.success) {
                    loadPickerFolderList();
                }
            });
    };

    document.getElementById('uploadBtn').onclick = async () => {
        const fileInput = document.getElementById('fileInput');
        const files = Array.from(fileInput.files);
        if (files.length === 0) { showToast('请选择文件'); return; }

        let targetParentId = currentParentId;
        let newName = files.length === 1 ? files[0].name : null;

        if (files.length === 1) {
            const result = await openUploadSetupModal(files);
            if (!result.confirmed) {
                fileInput.value = '';
                return;
            }
            newName = result.newName;
            targetParentId = result.targetParentId;
            await uploadSingleFile(files[0], newName, targetParentId);
        } else {
            targetParentId = currentParentId;
            for (const file of files) {
                try {
                    const renameResult = await requestRename(file.name);
                    await uploadSingleFile(file, renameResult, targetParentId);
                } catch (e) { continue; }
            }
        }

        loadFileList();
        fileInput.value = '';
        loadSpaceInfo();
    };

    document.getElementById('newFolderBtn').onclick = () => {
        const folderName = prompt('请输入文件夹名称');
        if (!folderName) return;
        const formData = new FormData();
        formData.append('folderName', folderName);
        formData.append('parentId', currentParentId);
        fetch('/api/file/folder/create', { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
                showToast(data.message);
                if (data.success) loadFileList();
            });
    };

    function openVersionModal(fileId) {
        currentFileIdForVersion = fileId;
        fetch('/api/file/versions?fileId=' + fileId)
            .then(res => res.json())
            .then(versions => {
                const container = document.getElementById('versionListContainer');
                if (!versions || versions.length === 0) {
                    container.innerHTML = '<p>暂无历史版本</p>';
                } else {
                    let html = '';
                    versions.forEach(v => {
                        html += `<div class="version-item">
                        <strong>版本 ${v.versionNumber}</strong>：${v.fileName} (${formatSize(v.fileSize)})<br>
                        <small>${parseLocalTime(v.createdAt)}</small><br>
                        <button onclick="previewVersion(${v.id}, '${v.fileName}')">预览</button>
                        <button onclick="rollbackVersion(${fileId}, ${v.versionNumber})">回滚到此版本</button>
                        <button onclick="deleteVersionRequest(${v.id}, ${fileId})">删除此版本</button>
                    </div>`;
                    });
                    container.innerHTML = html;
                }
                document.getElementById('versionModal').style.display = 'block';
            });
    }

    function closeVersionModal() { document.getElementById('versionModal').style.display = 'none'; }
    function rollbackVersion(fileId, versionNumber) {
        fetch('/api/file/rollback?fileId=' + fileId + '&version=' + versionNumber, { method: 'POST' })
            .then(res => res.text())
            .then(msg => { showToast(msg); closeVersionModal(); loadFileList(); loadSpaceInfo(); });
    }
    function deleteVersionRequest(versionId, fileId) {
        showConfirm('确定要删除此历史版本吗？', function() {
            fetch('/api/file/version/delete?versionId=' + versionId + '&fileId=' + fileId, { method: 'POST' })
                .then(res => res.text())
                .then(msg => { showToast(msg); openVersionModal(fileId); loadSpaceInfo(); });
        });
    }
    function openShareModal(fileId) {
        const modal = document.getElementById('shareModal');
        const content = document.getElementById('shareContent');
        content.innerHTML = `
            <p>设置提取码（可选）：<input type="text" id="sharePwd" placeholder="留空则无需密码"></p>
            <p>有效期天数（可选）：<input type="number" id="shareDays" min="1" placeholder="留空则永久"></p>
            <button onclick="createShare(${fileId})">生成分享链接</button>
            <div id="shareResult" style="margin-top:15px;"></div>
        `;
        modal.style.display = 'block';
    }
    function closeShareModal() { document.getElementById('shareModal').style.display = 'none'; }
    function createShare(fileId) {
        const password = document.getElementById('sharePwd').value;
        const days = document.getElementById('shareDays').value;
        const params = new URLSearchParams();
        params.append('fileId', fileId);
        if (password) params.append('password', password);
        if (days) params.append('expireDays', days);
        fetch('/api/share/create', { method: 'POST', body: params })
            .then(res => res.json())
            .then(share => {
                const link = window.location.origin + '/s/' + share.shareCode;
                const resultDiv = document.getElementById('shareResult');
                resultDiv.innerHTML = `
                    <p>分享链接：<input type="text" value="${link}" readonly style="width:80%"></p>
                    <p>${share.password ? '提取码：' + share.password : '无提取码'}</p>
                    <button onclick="navigator.clipboard.writeText('${link}')">复制链接</button>
                `;
            })
            .catch(err => showToast('生成分享失败：' + err));
    }
    window.onclick = function(event) {
        if (event.target.classList.contains('modal')) {
            if (event.target.id === 'imagePreviewModal') closeImagePreview();
            else if (event.target.id !== 'uploadSetupModal' && event.target.id !== 'folderPickerModal') {
                event.target.style.display = 'none';
            }
        }
    }
    function logoutAndClose() {
        showConfirm('确定退出并关闭页面吗？', function() {
            fetch('/api/user/logout').then(() => { window.close(); setTimeout(() => { window.location.href = '/login'; }, 100); });
        });
    }
    function switchAccount() {
        showConfirm('确定切换账号吗？', function() {
            fetch('/api/user/logout').then(() => { window.location.href = '/login'; });
        });
    }
    function fetchUserInfo() {
        fetch('/api/user/info')
            .then(res => {
                if (!res.ok) throw new Error('获取用户信息失败');
                return res.json();
            })
            .then(user => {
                if (user) {
                    const avatarImg = document.getElementById('headerAvatar');
                    const usernameSpan = document.getElementById('headerUsername');
                    if (avatarImg) {
                        avatarImg.src = user.avatar ? user.avatar : '/images/default.png';
                    }
                    if (usernameSpan) {
                        usernameSpan.innerText = user.username || '';
                    }
                }
            })
            .catch(err => console.error('获取用户信息出错:', err));
    }

    fetchUserInfo();
    loadSpaceInfo();
    loadFileList();
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>注册</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
            text-align: center;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        h2 { font-size: 28px; font-weight: 600; color: #1e293b; margin-bottom: 24px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 14px; font-weight: 500; color: #475569; margin-bottom: 6px; }
        .email-wrapper {
            display: flex;
            align-items: center;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            background: #f8fafc;
            transition: all 0.2s;
        }
        .email-wrapper:focus-within {
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102,126,234,0.1);
        }
        .email-wrapper input {
            flex: 1;
            padding: 12px 0 12px 16px;
            font-size: 16px;
            border: none;
            outline: none;
            background: transparent;
        }
        .email-suffix {
            padding: 12px 16px 12px 0;
            color: #64748b;
            font-size: 16px;
            font-weight: 500;
        }
        .input-group input {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            outline: none;
            background: #f8fafc;
            transition: all 0.2s;
        }
        .input-group input:focus {
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102,126,234,0.1);
        }
        .code-row { display: flex; gap: 10px; }
        .code-row input { flex: 1; }
        .code-row button {
            width: auto;
            padding: 12px 16px;
            white-space: nowrap;
            margin-top: 0;
            background: #3b82f6;
            box-shadow: none;
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        button {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 4px 12px rgba(102,126,234,0.3);
            margin-top: 8px;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(102,126,234,0.4); }
        .link-text { margin-top: 24px; color: #64748b; font-size: 14px; }
        .link-text a { color: #667eea; text-decoration: none; font-weight: 500; margin-left: 6px; }
        .link-text a:hover { text-decoration: underline; }
        .message { margin-top: 16px; min-height: 24px; font-size: 14px; font-weight: 500; }
        .message.error { color: #ef4444; }
        .message.success { color: #10b981; }
    </style>
</head>
<body>
<div class="container">
    <h2><i class="fas fa-user-plus"></i> 注册账号</h2>
    <form id="registerForm">
        <div class="input-group">
            <label><i class="fas fa-envelope"></i> QQ邮箱</label>
            <div class="email-wrapper">
                <input type="text" id="qqNumber" placeholder="请输入QQ号" required>
                <span class="email-suffix">@qq.com</span>
            </div>
        </div>
        <div class="input-group">
            <label><i class="fas fa-shield-alt"></i> 验证码</label>
            <div class="code-row">
                <input type="text" id="code" placeholder="请输入验证码" required>
                <button type="button" id="sendCodeBtn">获取验证码</button>
            </div>
        </div>
        <div class="input-group">
            <label><i class="fas fa-lock"></i> 密码</label>
            <input type="password" id="password" placeholder="请输入密码" required>
        </div>
        <button type="submit"><i class="fas fa-check-circle"></i> 注册</button>
    </form>
    <div class="link-text">
        已有账号？<a href="/login">去登录</a>
    </div>
    <p id="message" class="message"></p>
</div>
<script>
    let countdown = 0;
    const sendBtn = document.getElementById('sendCodeBtn');
    const msgEl = document.getElementById('message');

    sendBtn.addEventListener('click', async () => {
        const qqNumber = document.getElementById('qqNumber').value.trim();
        if (!qqNumber) {
            msgEl.innerText = '请输入QQ号';
            return;
        }
        if (countdown > 0) return;
        const email = qqNumber + "@qq.com";
        const resp = await fetch('/api/user/send-code?email=' + encodeURIComponent(email), { method: 'POST' });
        const text = await resp.text();
        if (text === '验证码已发送') {
            countdown = 60;
            sendBtn.disabled = true;
            const timer = setInterval(() => {
                countdown--;
                sendBtn.innerText = countdown + '秒后重发';
                if (countdown <= 0) {
                    clearInterval(timer);
                    sendBtn.disabled = false;
                    sendBtn.innerText = '获取验证码';
                }
            }, 1000);
            msgEl.className = 'message success';
            msgEl.innerText = '验证码已发送';
        } else {
            msgEl.className = 'message error';
            msgEl.innerText = text;
        }
    });

    document.getElementById("registerForm").addEventListener("submit", async function(e) {
        e.preventDefault();
        const qqNumber = document.getElementById('qqNumber').value.trim();
        if (!qqNumber) {
            msgEl.innerText = '请输入QQ号';
            return;
        }
        const email = qqNumber + "@qq.com";
        const code = document.getElementById("code").value;
        const password = document.getElementById("password").value;
        const params = new URLSearchParams();
        params.append('email', email);
        params.append('code', code);
        params.append('password', password);
        const resp = await fetch("/api/user/register", { method: "POST", body: params });
        const text = await resp.text();
        if (text === "注册成功") {
            msgEl.className = "message success";
            msgEl.innerText = text + "，3秒后跳转到登录页";
            setTimeout(() => { window.location.href = "/login"; }, 3000);
        } else {
            msgEl.className = "message error";
            msgEl.innerText = text;
        }
    });
</script>
</body>
</html>

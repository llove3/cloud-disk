<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
            text-align: center;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        h2 { font-size: 28px; font-weight: 600; color: #1e293b; margin-bottom: 24px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 14px; font-weight: 500; color: #475569; margin-bottom: 6px; }
        .email-wrapper {
            display: flex;
            align-items: center;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            background: #f8fafc;
            transition: all 0.2s;
        }
        .email-wrapper:focus-within {
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102,126,234,0.1);
        }
        .email-wrapper input {
            flex: 1;
            padding: 12px 0 12px 16px;
            font-size: 16px;
            border: none;
            outline: none;
            background: transparent;
        }
        .email-suffix {
            padding: 12px 16px 12px 0;
            color: #64748b;
            font-size: 16px;
            font-weight: 500;
        }
        .password-wrapper {
            position: relative;
        }
        .password-wrapper input {
            width: 100%;
            padding: 12px 48px 12px 16px;
            font-size: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            outline: none;
            background: #f8fafc;
            transition: all 0.2s;
        }
        .password-wrapper input:focus {
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102,126,234,0.1);
        }
        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            cursor: pointer;
            font-size: 18px;
        }
        button {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 4px 12px rgba(102,126,234,0.3);
            margin-top: 8px;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(102,126,234,0.4); }
        .link-text { margin-top: 24px; color: #64748b; font-size: 14px; }
        .link-text a { color: #667eea; text-decoration: none; font-weight: 500; margin: 0 6px; }
        .link-text a:hover { text-decoration: underline; }
        .message { margin-top: 16px; min-height: 24px; font-size: 14px; font-weight: 500; color: #ef4444; }
    </style>
</head>
<body>
<div class="container">
    <h2><i class="fas fa-cloud-upload-alt" style="margin-right: 8px; color: #667eea;"></i>云盘登录</h2>
    <form id="loginForm">
        <div class="input-group">
            <label><i class="fas fa-envelope"></i> QQ邮箱</label>
            <div class="email-wrapper">
                <input type="text" id="qqNumber" placeholder="请输入QQ号" required>
                <span class="email-suffix">@qq.com</span>
            </div>
        </div>
        <div class="input-group">
            <label><i class="fas fa-lock"></i> 密码</label>
            <div class="password-wrapper">
                <input type="password" id="password" placeholder="请输入密码" required>
                <i class="fas fa-eye toggle-password" onclick="togglePassword('password', this)"></i>
            </div>
        </div>
        <button type="submit"><i class="fas fa-sign-in-alt"></i> 登录</button>
    </form>
    <div class="link-text">
        <a href="/register">注册账号</a> | <a href="#" id="forgotPasswordLink">忘记密码？</a>
    </div>
    <p id="message" class="message"></p>
</div>
<script>
    function togglePassword(inputId, icon) {
        const input = document.getElementById(inputId);
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }

    document.getElementById('forgotPasswordLink').addEventListener('click', function(e) {
        e.preventDefault();
        const qq = document.getElementById('qqNumber').value.trim();
        let url = '/forgot-password';
        if (qq) url += '?qq=' + encodeURIComponent(qq);
        window.location.href = url;
    });

    document.getElementById("loginForm").addEventListener("submit", async function(e) {
        e.preventDefault();
        const qqNumber = document.getElementById("qqNumber").value.trim();
        if (!qqNumber) {
            document.getElementById("message").innerText = "请输入QQ号";
            return;
        }
        const email = qqNumber + "@qq.com";
        const password = document.getElementById("password").value;
        const resp = await fetch("/api/user/login?email=" + encodeURIComponent(email) + "&password=" + encodeURIComponent(password), { method: "POST" });
        const text = await resp.text();
        if (text === "登录成功") {
            window.location.href = "/files";
        } else {
            document.getElementById("message").innerText = text;
        }
    });
</script>
</body>
</html>

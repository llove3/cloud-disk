spring.application.name=cloud-disk
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cloud_disk_ai?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
spring.datasource.username=${MYSQL_NAME}
spring.datasource.password=${MYSQL_PSW}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.example.clouddisk.entity

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

file.upload-dir=${FILE_UPLOAD_DIR:./uploads-ai}
mybatis.configuration.map-underscore-to-camel-case=true

spring.mail.host=smtp.qq.com
spring.mail.port=465
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.auth.mechanisms=LOGIN
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.fallback=false
spring.mail.properties.mail.smtp.ssl.trust=smtp.qq.com
spring.mail.default-encoding=UTF-8
spring.mail.protocol=smtp

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
ai.elasticsearch.url=${ELASTICSEARCH_URL:http://localhost:19200}
spring.ai.model.chat=deepseek
spring.ai.deepseek.api-key=${DEEPSEEK_API_KEY}
spring.ai.deepseek.chat.model=deepseek-chat
spring.ai.model.embedding=transformers
spring.ai.embedding.transformer.onnx.model-uri=${AI_MODEL_URI:https://huggingface.co/sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2/resolve/86741b4e3f5cb7765a600d3a3d55a0f6a6cb443d/onnx/model.onnx}
spring.ai.embedding.transformer.tokenizer.uri=${AI_TOKENIZER_URI:https://huggingface.co/sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2/resolve/86741b4e3f5cb7765a600d3a3d55a0f6a6cb443d/tokenizer.json}
spring.ai.embedding.transformer.tokenizer.options.padding=true
spring.ai.embedding.transformer.tokenizer.options.truncation=true
spring.ai.embedding.transformer.tokenizer.options.maxLength=128
spring.ai.embedding.transformer.cache.directory=${AI_MODEL_CACHE:${user.home}/.cache/cloud-disk/models}

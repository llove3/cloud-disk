<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>回收站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            padding: 24px 32px;
            min-height: 100vh;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }
        .header h2 {
            font-size: 28px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #0f172a;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 16px;
            background: white;
            padding: 8px 16px;
            border-radius: 40px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }
        .user-info a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 500;
            margin: 0 4px;
        }
        .nav-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: white;
            padding: 10px 20px;
            border-radius: 40px;
            text-decoration: none;
            color: #3b82f6;
            font-weight: 500;
            margin-bottom: 20px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
        .file-table-container {
            background: white;
            border-radius: 24px;
            padding: 8px 0;
            box-shadow: 0 8px 24px rgba(0,0,0,0.04);
            border: 1px solid #eef2f6;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            text-align: left;
            padding: 18px 20px;
            background: #f8fafc;
            font-weight: 600;
            font-size: 14px;
            color: #475569;
            border-bottom: 1px solid #e2e8f0;
        }
        td {
            padding: 16px 20px;
            border-bottom: 1px solid #f1f5f9;
            color: #334155;
        }
        .action-buttons {
            display: flex;
            gap: 8px;
        }
        .action-btn {
            background: none;
            border: 1px solid #e2e8f0;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            color: #475569;
            cursor: pointer;
            transition: all 0.15s;
        }
        .action-btn:hover {
            background: #3b82f6;
            border-color: #3b82f6;
            color: white;
        }
        #toast {
            visibility: hidden;
            min-width: 280px;
            background: #1e293b;
            color: white;
            text-align: center;
            border-radius: 60px;
            padding: 14px 24px;
            position: fixed;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            z-index: 1000;
            font-weight: 500;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        #toast.show {
            visibility: visible;
            animation: toastFade 3s;
        }
        @keyframes toastFade {
            0% { opacity: 0; bottom: 10px; }
            10% { opacity: 1; bottom: 30px; }
            90% { opacity: 1; bottom: 30px; }
            100% { opacity: 0; bottom: 10px; }
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.4);
        }
        .confirm-dialog {
            background: white;
            padding: 32px;
            border-radius: 28px;
            width: 360px;
            margin: 15% auto;
            text-align: center;
        }
        .confirm-dialog button {
            padding: 10px 28px;
            margin: 8px;
            border-radius: 40px;
            border: none;
            font-weight: 600;
            cursor: pointer;
        }
        #confirmYes {
            background: #3b82f6;
            color: white;
        }
        #confirmNo {
            background: #f1f5f9;
            color: #1e293b;
        }
    </style>
</head>
<body>
<div class="header">
    <h2><i class="fas fa-trash-alt" style="color: #ef4444;"></i> 回收站</h2>
    <div class="user-info">
        <i class="fas fa-user-circle"></i>
        <span th:text="${session.user.username}"></span>
        <a href="/files"><i class="fas fa-cloud"></i> 返回网盘</a>
        <a href="/api/user/logout"><i class="fas fa-sign-out-alt"></i> 退出</a>
    </div>
</div>
<a href="/files" class="nav-link"><i class="fas fa-arrow-left"></i> 回到我的文件</a>
<div class="file-table-container">
    <table>
        <thead>
        <tr><th>文件名</th><th>大小</th><th>删除时间</th><th>操作</th></tr>
        </thead>
        <tbody id="recycleList"></tbody>
    </table>
</div>
<div id="toast"></div>
<div id="confirmModal" class="modal">
    <div class="confirm-dialog">
        <p id="confirmMessage">确定要执行此操作吗？</p>
        <button id="confirmYes">确定</button>
        <button id="confirmNo">取消</button>
    </div>
</div>
<script>
    let confirmCallback = null;

    function parseLocalTime(dateStr) {
        if (!dateStr) return '';
        let d = new Date(dateStr);
        if (!isNaN(d.getTime())) return d.toLocaleString();
        d = new Date(dateStr.replace(' ', 'T') + 'Z');
        if (!isNaN(d.getTime())) return d.toLocaleString();
        return dateStr;
    }

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.className = 'show';
        setTimeout(() => { toast.className = toast.className.replace('show', ''); }, 3000);
    }

    function showConfirm(message, onConfirm) {
        document.getElementById('confirmMessage').innerText = message;
        document.getElementById('confirmModal').style.display = 'block';
        confirmCallback = onConfirm;
    }

    function closeConfirm() {
        document.getElementById('confirmModal').style.display = 'none';
        confirmCallback = null;
    }

    document.getElementById('confirmYes').onclick = function() {
        if (confirmCallback) confirmCallback();
        closeConfirm();
    };
    document.getElementById('confirmNo').onclick = closeConfirm;

    function formatSize(bytes) {
        if (bytes === 0) return '0 B';
        const k = 1024;
        const sizes = ['B', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return (bytes / Math.pow(k, i)).toFixed(2) + ' ' + sizes[i];
    }

    function loadRecycleBin() {
        fetch('/api/recycle/list')
            .then(res => res.json())
            .then(files => {
                const tbody = document.getElementById('recycleList');
                tbody.innerHTML = '';
                if (files.length === 0) {
                    const row = tbody.insertRow();
                    const cell = row.insertCell(0);
                    cell.colSpan = 4;
                    cell.innerText = '回收站为空';
                    return;
                }
                files.forEach(file => {
                    const row = tbody.insertRow();
                    row.insertCell(0).innerText = file.fileName;
                    row.insertCell(1).innerText = formatSize(file.fileSize);
                    row.insertCell(2).innerText = parseLocalTime(file.deletedAt);
                    const actions = row.insertCell(3);
                    const restoreBtn = document.createElement('button');
                    restoreBtn.className = 'action-btn';
                    restoreBtn.innerHTML = '<i class="fas fa-undo-alt"></i> 还原';
                    restoreBtn.onclick = () => {
                        fetch('/api/recycle/restore?fileId=' + file.id, { method: 'POST' })
                            .then(res => res.text())
                            .then(msg => { showToast(msg); loadRecycleBin(); });
                    };
                    const permanentBtn = document.createElement('button');
                    permanentBtn.className = 'action-btn';
                    permanentBtn.innerHTML = '<i class="fas fa-trash"></i> 彻底删除';
                    permanentBtn.onclick = () => {
                        showConfirm('彻底删除后将无法恢复，确定吗？', function() {
                            fetch('/api/recycle/permanent?fileId=' + file.id, { method: 'POST' })
                                .then(res => res.text())
                                .then(msg => { showToast(msg); loadRecycleBin(); });
                        });
                    };
                    actions.appendChild(restoreBtn);
                    actions.appendChild(permanentBtn);
                });
            });
    }

    window.onclick = function(event) {
        const confirmModal = document.getElementById('confirmModal');
        if (event.target === confirmModal) closeConfirm();
    }

    loadRecycleBin();
</script>
</body>
</html>

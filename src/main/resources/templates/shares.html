<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>我的分享</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f1f5f9; color: #1e293b; padding: 24px 32px; min-height: 100vh; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
        .header h2 { font-size: 28px; font-weight: 600; color: #0f172a; }
        .user-info { display: flex; align-items: center; gap: 16px; background: white; padding: 8px 16px; border-radius: 40px; }
        .user-info a { color: #3b82f6; text-decoration: none; }
        .avatar-icon { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
        .nav-link { margin-bottom: 20px; }
        .nav-link a { color: #3b82f6; text-decoration: none; }
        .table-container { background: white; border-radius: 24px; padding: 8px 0; box-shadow: 0 8px 24px rgba(0,0,0,0.04); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 18px 20px; background: #f8fafc; font-weight: 600; }
        td { padding: 16px 20px; border-bottom: 1px solid #f1f5f9; }
        .action-btn { background: none; border: 1px solid #e2e8f0; padding: 6px 12px; border-radius: 20px; cursor: pointer; }
        .action-btn:hover { background: #3b82f6; color: white; }
        #toast { visibility: hidden; min-width: 280px; background: #1e293b; color: white; text-align: center; border-radius: 60px; padding: 14px 24px; position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%); z-index: 1000; }
        #toast.show { visibility: visible; animation: toastFade 3s; }
        @keyframes toastFade { 0% { opacity: 0; bottom: 10px; } 10% { opacity: 1; bottom: 30px; } 90% { opacity: 1; bottom: 30px; } 100% { opacity: 0; bottom: 10px; } }
    </style>
</head>
<body>
<div class="header">
    <h2><i class="fas fa-share-alt" style="color:#3b82f6;"></i> 我的分享</h2>
    <div class="user-info">
        <a href="/profile"><img id="headerAvatar" class="avatar-icon" src="/images/default.png" alt="头像"></a>
        <span th:text="${session.user.username}"></span>
        <a href="/files"><i class="fas fa-cloud"></i> 返回网盘</a>
        <a href="/api/user/logout">退出</a>
    </div>
</div>
<div class="nav-link"><a href="/files"><i class="fas fa-arrow-left"></i> 返回文件列表</a></div>
<div class="table-container">
    <table>
        <thead><tr><th>文件名</th><th>分享码</th><th>提取码</th><th>有效期</th><th>创建时间</th><th>操作</th></tr></thead>
        <tbody id="shareList"></tbody>
    </table>
</div>
<div id="toast"></div>
<script>
    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.className = 'show';
        setTimeout(() => { toast.className = toast.className.replace('show', ''); }, 3000);
    }
    function parseLocalTime(str) {
        if (!str) return '永久';
        return new Date(str).toLocaleString();
    }
    function loadShares() {
        fetch('/api/share/list')
            .then(res => res.json())
            .then(shares => {
                const tbody = document.getElementById('shareList');
                tbody.innerHTML = '';
                shares.forEach(s => {
                    const row = tbody.insertRow();
                    row.insertCell(0).innerText = s.fileName || '未知文件';
                    row.insertCell(1).innerHTML = `<code>${s.shareCode}</code>`;
                    row.insertCell(2).innerText = s.password || '无';
                    row.insertCell(3).innerText = s.expireTime ? parseLocalTime(s.expireTime) : '永久';
                    row.insertCell(4).innerText = parseLocalTime(s.createdAt);
                    const actions = row.insertCell(5);
                    const copyBtn = document.createElement('button');
                    copyBtn.className = 'action-btn';
                    copyBtn.innerHTML = '<i class="fas fa-copy"></i> 复制链接';
                    copyBtn.onclick = () => {
                        navigator.clipboard.writeText(window.location.origin + '/s/' + s.shareCode);
                        showToast('链接已复制');
                    };
                    const delBtn = document.createElement('button');
                    delBtn.className = 'action-btn';
                    delBtn.innerHTML = '<i class="fas fa-trash"></i> 删除';
                    delBtn.onclick = () => {
                        if (confirm('确定删除该分享吗？')) {
                            fetch('/api/share/delete?shareId=' + s.id, { method: 'POST' })
                                .then(res => res.text())
                                .then(msg => { showToast(msg); loadShares(); });
                        }
                    };
                    actions.appendChild(copyBtn);
                    actions.appendChild(delBtn);
                });
            });
    }
    loadShares();
    fetch('/api/user/info').then(res => res.json()).then(user => {
        if (user && user.avatar) document.getElementById('headerAvatar').src = user.avatar;
    });
</script>
</body>
</html>
